[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-cnf-deformation"
version = "0.1.0"
description = "deformation adapters for Generative CNF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["generative-cnf==0.1.0", "numpy>=1.24", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
