[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-cnf-shape-completion"
version = "0.1.0"
description = "shape completion adapters for Generative CNF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "generative-cnf==0.1.0",
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
eval = [
  "scipy>=1.10",
  "trimesh>=4.0",
  "scikit-image>=0.22",
]

[tool.setuptools.packages.find]
where = ["src"]
